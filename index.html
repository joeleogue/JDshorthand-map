<script>

const route = [
  [-8.4921, 51.8935],
  [-7.0, 50.0],
  [-5.0, 48.5],
  [-2.0, 46.0],
  [2.0, 43.0],
  [10.0, 38.0],
  [18.0, 33.0],
  [28.0, 28.0],
  [38.0, 20.0],
  [48.0, 13.0],
  [58.0, 7.0],
  [68.0, 1.0],
  [78.0, -5.0],
  [88.0, -10.0],
  [98.0, -15.0],
  [108.0, -20.0],
  [118.0, -25.0],
  [128.0, -30.0],
  [138.0, -35.0],
  [148.0, -40.0],
  [158.0, -44.0],
  [168.0, -47.0],
  [174.0, -48.5],
  [178.7672, -49.6882]
];

const isMobile = window.innerWidth < 768;

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
  renderWorldCopies: false,
  attributionControl: true
});

map.scrollZoom.disable();
map.boxZoom.disable();
map.dragPan.disable();
map.dragRotate.disable();
map.keyboard.disable();
map.doubleClickZoom.disable();
map.touchZoomRotate.disable();

window.addEventListener('resize', () => {
  map.resize();
});

map.on('load', () => {

  const bounds = new maplibregl.LngLatBounds();

  route.forEach(coord => {
    bounds.extend(coord);
  });

  map.fitBounds(bounds, {
    padding: isMobile ? 25 : 80,
    duration: 0
  });

  map.addSource('route', {
    type: 'geojson',
    data: {
      type: 'Feature',
      geometry: {
        type: 'LineString',
        coordinates: [route[0]]
      }
    }
  });

  map.addLayer({
    id: 'route-line',
    type: 'line',
    source: 'route',
    paint: {
      'line-color': '#0078D4',
      'line-width': isMobile ? 4 : 5,
      'line-opacity': 0.95
    }
  });

  map.addSource('head', {
    type: 'geojson',
    data: {
      type: 'Feature',
      geometry: {
        type: 'Point',
        coordinates: route[0]
      }
    }
  });

  map.addLayer({
    id: 'head-dot',
    type: 'circle',
    source: 'head',
    paint: {
      'circle-radius': isMobile ? 6 : 8,
      'circle-color': '#D83B01',
      'circle-opacity': 1,
      'circle-opacity-transition': {
        duration: 1200
      }
    }
  });

  map.addSource('destination-label', {
    type: 'geojson',
    data: {
      type: 'FeatureCollection',
      features: [{
        type: 'Feature',
        geometry: {
          type: 'Point',
          coordinates: [178.7672, -49.6882]
        },
        properties: {
          title: 'ANTIPODES ISLANDS',
          subtitle: 'New Zealand'
        }
      }]
    }
  });

  map.addLayer({
    id: 'destination-title',
    type: 'symbol',
    source: 'destination-label',
    layout: {
      'text-field': ['get', 'title'],
      'text-size': 18,
      'text-font': ['Open Sans Bold'],
      'text-anchor': 'top',
      'text-offset': [0, 1.2]
    },
    paint: {
      'text-color': '#111111',
      'text-halo-color': '#ffffff',
      'text-halo-width': 2,
      'text-opacity': 0,
      'text-opacity-transition': {
        duration: 1500
      }
    }
  });

  map.addLayer({
    id: 'destination-subtitle',
    type: 'symbol',
    source: 'destination-label',
    layout: {
      'text-field': ['get', 'subtitle'],
      'text-size': 13,
      'text-anchor': 'top',
      'text-offset': [0, 3]
    },
    paint: {
      'text-color': '#666666',
      'text-halo-color': '#ffffff',
      'text-halo-width': 2,
      'text-opacity': 0,
      'text-opacity-transition': {
        duration: 1500
      }
    }
  });

  function update(progress) {

    const total = route.length - 1;
    const current = progress * total;

    const seg = Math.floor(current);
    const rem = current - seg;

    let coords = route.slice(0, seg + 1);

    let head = route[Math.min(seg, total)];

    if (seg < total) {

      const start = route[seg];
      const end = route[seg + 1];

      head = [
        start[0] + (end[0] - start[0]) * rem,
        start[1] + (end[1] - start[1]) * rem
      ];

      coords.push(head);
    }

    map.getSource('route').setData({
      type: 'Feature',
      geometry: {
        type: 'LineString',
        coordinates: coords
      }
    });

    map.getSource('head').setData({
      type: 'Feature',
      geometry: {
        type: 'Point',
        coordinates: head
      }
    });

  }

  let progress = 0;
  let completed = false;

  function animate() {

    progress += 0.001;

    if (progress >= 1 && !completed) {

      progress = 1;
      completed = true;

      update(progress);

      map.setPaintProperty(
        'head-dot',
        'circle-opacity',
        0
      );

      map.setPaintProperty(
        'destination-title',
        'text-opacity',
        1
      );

      map.setPaintProperty(
        'destination-subtitle',
        'text-opacity',
        1
      );

      return;
    }

    update(progress);

    requestAnimationFrame(animate);
  }

  animate();

});

</script>
