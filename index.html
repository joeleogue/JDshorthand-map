<html lang="en">
<head>

}

#map {

}

</head>

<script>

const route = [

    [-5, 49],
    [0, 46],
    [8, 41],
    [18, 34],
    [30, 26],
    [44, 16],

const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
    renderWorldCopies: false
});

map.scrollZoom.disable();
map.boxZoom.disable();
map.dragPan.disable();
map.dragRotate.disable();
map.touchZoomRotate.disable();
map.doubleClickZoom.disable();
map.keyboard.disable();

map.on('load', () => {

    // Fit map

    map.fitBounds(
        [
            [-20, -55],
            [180, 60]
        ],
        {
            padding: 0,
            duration: 0
        }
    );

    // Remove all labels

    map.getStyle().layers.forEach(layer => {

        if (layer.type === 'symbol') {

            try {
                map.setLayoutProperty(
                    layer.id,
                    'visibility',
                    'none'
                );
            } catch (e) {}
        }

    });

    // Route source

    map.addSource('route', {
        type: 'geojson',
        data: {
            type: 'Feature',
            geometry: {
                type: 'LineString',
                coordinates: [route[0]]
            }
        }
    });

    map.addLayer({
        id: 'route-line',
        type: 'line',
        source: 'route',
        paint: {
            'line-color': '#005EB8',
            'line-width': 5,
            'line-opacity': 1
        }
    });

    // Moving marker

    map.addSource('head', {
        type: 'geojson',
        data: {
            type: 'Feature',
            geometry: {
                type: 'Point',
                coordinates: route[0]
            }
        }
    });

        id: 'head-dot',
        type: 'circle',
        source: 'head',
        paint: {
            'circle-radius': 7,
            'circle-color': '#D83B01',
            'circle-stroke-width': 2,
            'circle-stroke-color': '#ffffff'
        }
    });
