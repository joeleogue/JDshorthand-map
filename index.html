<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cork to Antipodes Islands</title>

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

<style>
html,
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
}

#map {
    width: 100%;
    height: 100vh;
}

.maplibregl-ctrl-attrib {
    font-size: 10px;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>

const route = [
    [-8.4921, 51.8935],     // Cork
    [0, 46],
    [12, 36],
    [25, 26],
    [42, 15],
    [60, 5],
    [82, -5],
    [105, -15],
    [128, -26],
    [148, -36],
    [165, -44],
    [178.7672, -49.6882]    // Antipodes Islands
];

const bounds = [
    [-20, -55],
    [180, 60]
];

const map = new maplibregl.Map({
    container: 'map',
    style: {
        version: 8,
        sources: {
            osm: {
                type: 'raster',
                tiles: [
                    'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
                ],
                tileSize: 256,
                attribution: '&copy; OpenStreetMap contributors'
            }
        },
        layers: [
            {
                id: 'osm',
                type: 'raster',
                source: 'osm'
            }
        ]
    },
    renderWorldCopies: false
});

map.scrollZoom.disable();
map.boxZoom.disable();
map.dragPan.disable();
map.dragRotate.disable();
map.touchZoomRotate.disable();
map.doubleClickZoom.disable();
map.keyboard.disable();

map.on('load', () => {

    map.fitBounds(bounds, {
        padding: 0,
        duration: 0
    });

    map.addSource('route', {
        type: 'geojson',
        data: {
            type: 'Feature',
            geometry: {
                type: 'LineString',
                coordinates: [route[0]]
            }
        }
    });

    map.addLayer({
        id: 'route-line',
        type: 'line',
        source: 'route',
        paint: {
            'line-color': '#005EB8',
            'line-width': 5,
            'line-opacity': 1
        }
    });

    map.addSource('head', {
        type: 'geojson',
        data: {
            type: 'Feature',
            geometry: {
                type: 'Point',
                coordinates: route[0]
            }
        }
    });

    map.addLayer({
        id: 'head-dot',
        type: 'circle',
        source: 'head',
        paint: {
            'circle-radius': 7,
            'circle-color': '#D83B01',
            'circle-stroke-color': '#ffffff',
            'circle-stroke-width': 2
        }
    });

    function update(progress) {

        const total = route.length - 1;
        const current = progress * total;

        const segment = Math.floor(current);
        const remainder = current - segment;

        let coords = route.slice(0, segment + 1);
        let head = route[Math.min(segment, total)];

        if (segment < total) {

            const start = route[segment];
            const end = route[segment + 1];

            head = [
                start[0] + (end[0] - start[0]) * remainder,
                start[1] + (end[1] - start[1]) * remainder
            ];

            coords.push(head);
        }

        map.getSource('route').setData({
            type: 'Feature',
            geometry: {
                type: 'LineString',
                coordinates: coords
            }
        });

        map.getSource('head').setData({
            type: 'Feature',
            geometry: {
                type: 'Point',
                coordinates: head
            }
        });
    }

    let progress = 0;

    function animate() {

        progress += 0.0015;

        if (progress > 1) {
            progress = 1;
        }

        update(progress);

        if (progress < 1) {
            requestAnimationFrame(animate);
        }
    }

    animate();

});

</script>

</body>
</html>
