<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ireland to Antipodes Islands</title>

<link
  href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css"
  rel="stylesheet"
/>

<style>
html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#map {
  width: 100%;
  height: 100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.js"></script>

<script>

const route = [
  [-8.492110492347729, 51.89346672223707],
  [20, 40],
  [80, 10],
  [140, -20],
  [178.7671865694536, -49.688154086945886]
];

const isMobile = window.innerWidth < 768;

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',

  center: isMobile
    ? [95, 0]
    : [85, 0],

  zoom: isMobile
    ? -1.0
    : 1.6,

  renderWorldCopies: false
});

/* Disable interaction */

map.scrollZoom.disable();
map.boxZoom.disable();
map.dragPan.disable();
map.dragRotate.disable();
map.keyboard.disable();
map.doubleClickZoom.disable();
map.touchZoomRotate.disable();

/* Help Shorthand iframe rendering */

window.addEventListener('resize', () => {
  map.resize();
});

map.on('load', () => {

  setTimeout(() => map.resize(), 500);
  setTimeout(() => map.resize(), 1000);
  setTimeout(() => map.resize(), 2000);

  map.addSource('route', {
    type: 'geojson',
    data: {
      type: 'Feature',
      geometry: {
        type: 'LineString',
        coordinates: [route[0]]
      }
    }
  });

  map.addLayer({
    id: 'route-line',
    type: 'line',
    source: 'route',
    paint: {
      'line-color': '#0066CC',
      'line-width': isMobile ? 4 : 5
    }
  });

  map.addSource('head', {
    type: 'geojson',
    data: {
      type: 'Feature',
      geometry: {
        type: 'Point',
        coordinates: route[0]
      }
    }
  });

  map.addLayer({
    id: 'head-dot',
    type: 'circle',
    source: 'head',
    paint: {
      'circle-radius': isMobile ? 6 : 8,
      'circle-color': '#D83B01'
    }
  });

  map.addSource('start', {
    type: 'geojson',
    data: {
      type: 'Feature',
      geometry: {
        type: 'Point',
        coordinates: route[0]
      }
    }
  });

  map.addLayer({
    id: 'start-point',
    type: 'circle',
    source: 'start',
    paint: {
      'circle-radius': 5,
      'circle-color': '#0066CC'
    }
  });

  map.addSource('end', {
    type: 'geojson',
    data: {
      type: 'Feature',
      geometry: {
        type: 'Point',
        coordinates: route[route.length - 1]
      }
    }
  });

  map.addLayer({
    id: 'end-point',
    type: 'circle',
    source: 'end',
    paint: {
      'circle-radius': 5,
      'circle-color': '#D83B01'
    }
  });

  function update(progress) {

    const total = route.length - 1;
    const current = progress * total;

    const seg = Math.floor(current);
    const rem = current - seg;

    let coords = route.slice(0, seg + 1);
    let head = route[Math.min(seg, total)];

    if (seg < total) {

      const start = route[seg];
      const end = route[seg + 1];

      head = [
        start[0] + (end[0] - start[0]) * rem,
        start[1] + (end[1] - start[1]) * rem
      ];

      coords.push(head);
    }

    map.getSource('route').setData({
      type: 'Feature',
      geometry: {
        type: 'LineString',
        coordinates: coords
      }
    });

    map.getSource('head').setData({
      type: 'Feature',
      geometry: {
        type: 'Point',
        coordinates: head
      }
    });
  }

  let progress = 0;

  function animate() {

    progress += 0.002;

    if (progress > 1) {
      progress = 1;
    }

    update(progress);

    if (progress < 1) {
      requestAnimationFrame(animate);
    }
  }

  animate();
});
</script>

</body>
</html>
