<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cork to Antipodes Islands</title>

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

<style>

html,
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #edf2f5;
}

#map {
    width: 100%;
    height: 100vh;
}

</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>

const route = [
    [-8.4921, 51.8935],
    [5, 40],
    [35, 20],
    [75, 0],
    [115, -20],
    [145, -37],
    [165, -45],
    [178.7672, -49.6882]
];

const bounds = [
    [-25, -65],
    [185, 65]
];

const map = new maplibregl.Map({
    container: 'map',
    style: {
        version: 8,
        sources: {
            osm: {
                type: 'raster',
                tiles: [
                    'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
                ],
                tileSize: 256
            }
        },
        layers: [
            {
                id: 'background',
                type: 'background',
                paint: {
                    'background-color': '#edf2f5'
                }
            },
            {
                id: 'osm',
                type: 'raster',
                source: 'osm'
            }
        ]
    },
    attributionControl: false,
    renderWorldCopies: false
});

map.scrollZoom.disable();
map.boxZoom.disable();
map.dragPan.disable();
map.dragRotate.disable();
map.touchZoomRotate.disable();
map.doubleClickZoom.disable();
map.keyboard.disable();

map.on('load', () => {

    map.fitBounds(bounds, {
        padding: 20,
        duration: 0
    });

    map.addSource('route', {
        type: 'geojson',
        data: {
            type: 'Feature',
            geometry: {
                type: 'LineString',
                coordinates: [route[0]]
            }
        }
    });

    map.addLayer({
        id: 'route-line',
        type: 'line',
        source: 'route',
        paint: {
            'line-color': '#006dcf',
            'line-width': 4
        }
    });

    map.addSource('head', {
        type: 'geojson',
        data: {
            type: 'Feature',
            geometry: {
                type: 'Point',
                coordinates: route[0]
            }
        }
    });

    map.addLayer({
        id: 'head-dot',
        type: 'circle',
        source: 'head',
        paint: {
            'circle-radius': 7,
            'circle-color': '#d83b01'
        }
    });

    function update(progress) {

        const total = route.length - 1;

        const current = progress * total;

        const seg = Math.floor(current);

        const rem = current - seg;

        let coords = route.slice(0, seg + 1);

        let head = route[Math.min(seg, total)];

        if (seg < total) {

            const start = route[seg];
            const end = route[seg + 1];

            head = [
                start[0] + (end[0] - start[0]) * rem,
                start[1] + (end[1] - start[1]) * rem
            ];

            coords.push(head);

        }

        map.getSource('route').setData({
            type: 'Feature',
            geometry: {
                type: 'LineString',
                coordinates: coords
            }
        });

        map.getSource('head').setData({
            type: 'Feature',
            geometry: {
                type: 'Point',
                coordinates: head
            }
        });

    }

    let progress = 0;

    function animate() {

        progress += 0.0015;

        if (progress > 1) {
            progress = 1;
        }

        update(progress);

        if (progress < 1) {
            requestAnimationFrame(animate);
        }

    }

    animate();

});

</script>

</body>
</html>
